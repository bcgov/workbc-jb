version: '3.4'
services:
    jb-dotnet-build:
        container_name: jb-dotnet-build
        scale: 0
        build:
            context: .
            dockerfile: ./dotnet-build.Dockerfile
    # The web tier is the Laravel rewrite (jobboard-laravel/), not WorkBC.Web.
    # The service name MUST stay `web` — the CI step tags `src_web:latest` as
    # <ecr>/jb:<sha>, and Deploy-Dev2 sets that image on deployment/jb2's `web`
    # container. Rename this and the whole chain breaks silently.
    #
    # The .NET app is still in src/WorkBC.Web and still builds if pointed at
    # again; only this build target changed.
    web:
        container_name: web
        build:
            # Relative to THIS file's directory (src/), so this is repo-root
            # jobboard-laravel/. Scoped to the app rather than the repo root so
            # the build context stays small and its .dockerignore applies.
            context: ../jobboard-laravel
            dockerfile: Dockerfile
            args:
                COMMIT_SHA: ${COMMIT_SHA}
                RUN_NUMBER: ${RUN_NUMBER}
                BUILD_DATE: ${BUILD_DATE}
        ports:
            - "8081:8081"
        env_file:
            - .env
    admin:
        build:
            context: .
            dockerfile: ./WorkBC.Admin/Dockerfile
        ports:
            - "8080:8080"
        environment:
            - ASPNETCORE_URLS=http://*:8080
            - ASPNETCORE_ENVIRONMENT=Development
        env_file:
            - .env
    importers-innovibe:
        container_name: importers-innovibe
        scale: 0
        build:
            context: ./WorkBC.Importers.Innovibe
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            - DB_HOST=postgres
            - DB_NAME=jobboard
    importers-federal-v2:
        container_name: importers-federal-v2
        scale: 0
        build:
            context: ./WorkBC.Importers.Federal.V2
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            - DB_HOST=postgres
            - DB_NAME=jobboard
    php-cli:
        container_name: php-cli
        build:
            context: .
            dockerfile: ./php-cli.Dockerfile
        env_file:
            - .env
        environment:
            - DB_HOST=postgres
            - DB_NAME=jobboard
    indexers-federal-v2:
        container_name: indexers-federal-v2
        scale: 0
        build:
            context: ./WorkBC.Indexers.Federal.V2
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            - DB_HOST=postgres
            - DB_NAME=jobboard
            - ELASTIC_URL=http://elasticsearch:9200
    indexers-innovibe-v2:
        container_name: indexers-innovibe-v2
        scale: 0
        build:
            context: ./WorkBC.Indexers.Innovibe.V2
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            - DB_HOST=postgres
            - DB_NAME=jobboard
            - ELASTIC_URL=http://elasticsearch:9200
    notifications-jobalerts-v2:
        container_name: notifications-jobalerts-v2
        scale: 0
        build:
            context: ./WorkBC.Notifications.JobAlerts.V2
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            - DB_HOST=postgres
            - DB_NAME=jobboard
            - ELASTIC_URL=http://elasticsearch:9200
    migration-runner:
        container_name: migration-runner
        scale: 0
        build:
            context: .
            dockerfile: ./EFMigrationRunner/Dockerfile
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        env_file:
            - .env
    dotnet-cli:
        container_name: dotnet-cli
        build:
            context: .
            dockerfile: ./dotnet-cli.Dockerfile
        env_file:
            - .env