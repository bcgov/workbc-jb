user  root;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs to stdout/stderr so the container log collector picks them up —
    # never to files, which would grow unbounded in the pod.
    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    server {
        # Must match the jb2 deployment's containerPort and WorkBC.Web's EXPOSE.
        listen 8081;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Kubernetes probe target that does not touch PHP, so readiness still
        # succeeds if php-fpm is briefly saturated. Laravel's own /up route
        # remains available and exercises the full stack.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Vite build output is content-hashed, so it can be cached hard.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Search can be slow on a cold OpenSearch connection; the default
            # 60s is enough, but be explicit rather than inherit it.
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Never serve dotfiles (.env, .git) even if one reaches the image.
        location ~ /\. {
            deny all;
        }

        error_page 404 /index.php;
    }
}
