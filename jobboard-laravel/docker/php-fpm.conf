[www]
; nginx and php-fpm share this container, so a unix socket is used rather than
; TCP — lower overhead and nothing is exposed outside the pod.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; php-fpm REFUSES to start a pool as root ("please specify user and group other
; than root", exit 78). The master process still runs as root — only the worker
; pool drops privileges. nginx runs as root and can still reach the socket.
; Consequence: storage/ and bootstrap/cache must be writable by www-data, which
; the Dockerfile chowns.
user = www-data
group = www-data

; Dynamic sizing: search pages are I/O-bound on OpenSearch, so workers spend
; most of their time waiting. Tune with the pod's CPU/memory limits in mind.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically to bound the effect of any slow leak.
pm.max_requests = 500

; Surface worker errors in the container log rather than a file.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; Kill a request that outlives the ingress timeout, so a stuck OpenSearch call
; cannot pin a worker indefinitely.
request_terminate_timeout = 60s
