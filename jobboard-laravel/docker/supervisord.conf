; nginx and php-fpm are two processes but one concern (serving the app), so
; they share a container under supervisord rather than being split into two.
[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
user = root

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
priority = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
; php-fpm has priority 5 so it is up first; nginx would otherwise fail its
; first requests against a missing socket.
command = nginx -g 'daemon off;'
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
