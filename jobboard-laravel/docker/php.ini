; Production PHP settings for the job board web container.

memory_limit = 256M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 16M

; Never render errors into a response — they would leak paths and query
; details to the browser. Laravel's own handler still logs them (LOG_CHANNEL).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

expose_php = Off

; MUST be Off. The php:8.3-fpm-alpine base leaves this On, which makes PHP treat
; the `<?xml version="1.0"?>` declaration in the SRCH-8 sitemap views as a short
; open tag — the view then dies with `syntax error, unexpected identifier
; "version"` and /sitemap.xml returns 500. It does not reproduce under Sail,
; where the setting is already Off.
short_open_tag = Off

date.timezone = America/Vancouver

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The filesystem is immutable in the image, so never stat files for changes.
opcache.validate_timestamps = 0
opcache.save_comments = 1
